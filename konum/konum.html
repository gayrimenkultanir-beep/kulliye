<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sultan II. Bayezid Külliyesi — Konum Takip</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Lato', sans-serif;
    background: #1a1610;
    color: #e8dfc4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    text-align: center;
    padding: 18px 20px 14px;
    border-bottom: 1px solid rgba(197,168,100,0.3);
    background: linear-gradient(180deg, #0f0d09 0%, #1a1610 100%);
  }

  header h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(14px, 2.5vw, 20px);
    color: #c5a864;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 400;
  }

  header p {
    font-size: 12px;
    color: rgba(232,223,196,0.5);
    margin-top: 4px;
    letter-spacing: 0.08em;
  }

  .map-wrapper {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .map-frame {
    position: relative;
    width: 100%;
    max-width: 900px;
    border: 1px solid rgba(197,168,100,0.25);
    border-radius: 4px;
    overflow: hidden;
    background: #f5f0e8;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
  }

  .map-frame img {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
  }

  /* Bölge tooltip alanları */
  .zone {
    position: absolute;
    cursor: default;
    border-radius: 2px;
    transition: background 0.2s;
  }
  .zone:hover .zone-label {
    opacity: 1;
    transform: translateY(0);
  }
  .zone-label {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: rgba(20,16,10,0.92);
    color: #c5a864;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    padding: 4px 10px;
    border-radius: 2px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    border: 1px solid rgba(197,168,100,0.4);
    z-index: 20;
  }

  /* Kullanıcı konum noktası */
  #user-marker {
    position: absolute;
    width: 24px;
    height: 24px;
    transform: translate(-50%, -50%);
    display: none;
    z-index: 30;
    pointer-events: none;
  }

  #user-marker .dot {
    width: 14px;
    height: 14px;
    background: #4a90e2;
    border: 2.5px solid #fff;
    border-radius: 50%;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    z-index: 2;
  }

  #user-marker .ring {
    width: 24px;
    height: 24px;
    background: rgba(74,144,226,0.3);
    border-radius: 50%;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%   { transform: translate(-50%,-50%) scale(0.8); opacity: 0.8; }
    70%  { transform: translate(-50%,-50%) scale(2.2); opacity: 0; }
    100% { transform: translate(-50%,-50%) scale(0.8); opacity: 0; }
  }

  #location-label {
    position: absolute;
    background: rgba(20,16,10,0.95);
    color: #fff;
    font-size: 11px;
    font-family: 'Lato', sans-serif;
    padding: 5px 12px;
    border-radius: 20px;
    transform: translate(-50%, -200%);
    white-space: nowrap;
    display: none;
    z-index: 31;
    border: 1px solid rgba(197,168,100,0.5);
    pointer-events: none;
  }
  #location-label span {
    color: #c5a864;
    font-weight: 700;
  }

  /* Alt bilgi çubuğu */
  .info-bar {
    background: #0f0d09;
    border-top: 1px solid rgba(197,168,100,0.2);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: rgba(232,223,196,0.7);
    letter-spacing: 0.05em;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.active { background: #4caf50; box-shadow: 0 0 6px #4caf5088; }
  .status-dot.searching { background: #ff9800; animation: blink 1s infinite; }
  .status-dot.error { background: #e53935; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .area-tag {
    background: rgba(197,168,100,0.15);
    border: 1px solid rgba(197,168,100,0.4);
    color: #c5a864;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 4px 14px;
    border-radius: 2px;
    display: none;
  }

  .btn {
    font-family: 'Lato', sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 7px 16px;
    border-radius: 2px;
    border: 1px solid rgba(197,168,100,0.5);
    background: transparent;
    color: #c5a864;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .btn:hover { background: rgba(197,168,100,0.15); }
  .btn.primary {
    background: rgba(74,144,226,0.2);
    border-color: rgba(74,144,226,0.6);
    color: #7ab8f5;
  }
  .btn.primary:hover { background: rgba(74,144,226,0.35); }

  .coords-small {
    font-size: 10px;
    color: rgba(232,223,196,0.35);
    font-family: monospace;
    margin-left: auto;
  }
</style>
</head>

      <div class="zone-label">Darüşşifa</div>
    </div>
    <div class="zone" style="left:46%;top:20%;width:28%;height:38%;" title="CAMİİ">
      <div class="zone-label">Camii</div>
    </div>
    <div class="zone" style="left:66%;top:10%;width:24%;height:22%;" title="İMARETHANE">
      <div class="zone-label">İmarethane</div>
    </div>
    <div class="zone" style="left:70%;top:43%;width:16%;height:18%;" title="TABHANE">
      <div class="zone-label">Tabhane</div>
    </div>

    <!-- Konum işaretçisi -->
    <div id="user-marker">
      <div class="ring"></div>
      <div class="dot"></div>
    </div>
    <div id="location-label">📍 <span id="area-name">Buradasınız</span></div>
  </div>
</div>

<div class="info-bar">
  <div class="status-pill">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Konum bekleniyor</span>
  </div>
  <div class="area-tag" id="areaTag"></div>
  <button class="btn primary" onclick="startGPS()">📡 Konumumu Göster</button>
  <button class="btn" onclick="startDemo()">▶ Demo Turu</button>
  <button class="btn" onclick="stopAll()">⏹ Durdur</button>
  <div class="coords-small" id="coordsDisplay"></div>
</div>

<script>
// ─── Koordinat sınırları (GPS bounding box) ───────────────────────
const GPS = {
  minLat: 41.6847878437749,
  maxLat: 41.68659687554467,
  minLon: 26.54270664906614,
  maxLon: 26.54525363544474
};

// ─── Bölge tanımları ──────────────────────────────────────────────
const zones = [
  {
    name: 'Medrese',
    pts: [[41.68558374393316,26.54270664906614],[41.68533022177119,26.542980131993296],[41.6857704644034,26.542999207966872],[41.68551807548888,26.54327815770988]]
  },
  {
    name: 'Giriş Bahçe',
    pts: [[41.68582254453236,26.542977750294337],[41.685580171266025,26.543235242364805],[41.68601283695287,26.543307662009624],[41.685800510636795,26.54357588291636]]
  },
  {
    name: 'Darüşşifa 1. Avlu',
    pts: [[41.68562223611326,26.54332911968216],[41.68534781256669,26.54361879826144],[41.685790495227224,26.543594658379835],[41.68548001675714,26.543921887886057]]
  },
  {
    name: 'Darüşşifa 2. Avlu',
    pts: [[41.685325778508535,26.543640255933983],[41.68519323328664,26.543778182729717],[41.68553175344533,26.543882496181823],[41.68537594940942,26.544049397705194]]
  },
  {
    name: 'Darüşşifa',
    pts: [[41.68520739734571,26.543755423431076],[41.685091251969226,26.543998189283247],[41.68539152982998,26.544038018055872],[41.68517906922443,26.54414991794086]]
  },
  {
    name: 'Camii',
    pts: [[41.686055342889446,26.543380304966412],[41.685188006077034,26.54431907814],[41.68645395335136,26.544120594668488],[41.68569879476613,26.545021816915135]]
  },
  {
    name: 'İmarethane',
    pts: [[41.68641589517322,26.544085725950612],[41.685692785511065,26.544957443897516],[41.68661419806502,26.544407591038702],[41.685903109104125,26.545276626776538]]
  },
  {
    name: 'Tabhane',
    pts: [[41.6856246805812,26.544581934628084],[41.68549247668799,26.544750913799326],[41.68573485028468,26.544758960426527],[41.68560665279357,26.54491452855244]]
  },
];

// ─── GPS → görsel yüzde dönüşümü ─────────────────────────────────
function gpsToPct(lat, lon) {
  const x = (lon - GPS.minLon) / (GPS.maxLon - GPS.minLon) * 100;
  const y = (GPS.maxLat - lat) / (GPS.maxLat - GPS.minLat) * 100;
  return { x, y };
}

// ─── Nokta polygon içinde mi? (ray casting) ───────────────────────
function pointInPolygon(lat, lon, pts) {
  let inside = false;
  const n = pts.length;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const xi = pts[i][1], yi = pts[i][0];
    const xj = pts[j][1], yj = pts[j][0];
    const intersect = ((yi > lat) !== (yj > lat)) &&
      (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function detectZone(lat, lon) {
  for (const z of zones) {
    if (pointInPolygon(lat, lon, z.pts)) return z.name;
  }
  return null;
}

// ─── İşaretçiyi göster ───────────────────────────────────────────
function showMarker(lat, lon, zone) {
  const pct = gpsToPct(lat, lon);
  const marker = document.getElementById('user-marker');
  const label = document.getElementById('location-label');
  const areaName = document.getElementById('area-name');
  const areaTag = document.getElementById('areaTag');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const coordsDisplay = document.getElementById('coordsDisplay');

  marker.style.left = pct.x + '%';
  marker.style.top = pct.y + '%';
  label.style.left = pct.x + '%';
  label.style.top = pct.y + '%';

  marker.style.display = 'block';
  label.style.display = 'block';

  statusDot.className = 'status-dot active';

  if (zone) {
    areaName.textContent = zone;
    areaTag.textContent = '📍 ' + zone;
    areaTag.style.display = 'inline-block';
    statusText.textContent = 'Konumunuz tespit edildi';
  } else {
    areaName.textContent = 'Müze Alanı';
    areaTag.style.display = 'none';
    statusText.textContent = 'Müze sınırları dışında';
  }

  coordsDisplay.textContent = lat.toFixed(6) + ', ' + lon.toFixed(6);
}

// ─── GPS ──────────────────────────────────────────────────────────
let watchId = null;

function startGPS() {
  if (!navigator.geolocation) {
    document.getElementById('statusText').textContent = 'Tarayıcınız konum desteklemiyor';
    return;
  }
  stopAll();
  document.getElementById('statusDot').className = 'status-dot searching';
  document.getElementById('statusText').textContent = 'GPS sinyali aranıyor...';

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const zone = detectZone(lat, lon);
      showMarker(lat, lon, zone);
    },
    (err) => {
      document.getElementById('statusDot').className = 'status-dot error';
      document.getElementById('statusText').textContent = 'Konum izni reddedildi veya alınamadı';
    },
    { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
  );
}

// ─── Demo turu ────────────────────────────────────────────────────
const demoRoute = [
  { lat: 41.685965, lon: 26.543222, zone: null },
  { lat: 41.685800, lon: 26.543200, zone: 'Giriş Bahçe' },
  { lat: 41.685620, lon: 26.543400, zone: 'Giriş Bahçe' },
  { lat: 41.685620, lon: 26.543500, zone: 'Darüşşifa 1. Avlu' },
  { lat: 41.685480, lon: 26.543700, zone: 'Darüşşifa 1. Avlu' },
  { lat: 41.685320, lon: 26.543800, zone: 'Darüşşifa 2. Avlu' },
  { lat: 41.685200, lon: 26.543900, zone: 'Darüşşifa' },
  { lat: 41.685500, lon: 26.543100, zone: 'Medrese' },
  { lat: 41.686000, lon: 26.543700, zone: 'Camii' },
  { lat: 41.686400, lon: 26.544200, zone: 'İmarethane' },
  { lat: 41.685600, lon: 26.544700, zone: 'Tabhane' },
];

let demoInterval = null, demoStep = 0;

function startDemo() {
  stopAll();
  demoStep = 0;
  function step() {
    if (demoStep >= demoRoute.length) { demoStep = 0; }
    const p = demoRoute[demoStep++];
    showMarker(p.lat, p.lon, p.zone);
  }
  step();
  demoInterval = setInterval(step, 2000);
}

function stopAll() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (demoInterval) { clearInterval(demoInterval); demoInterval = null; }
  document.getElementById('user-marker').style.display = 'none';
  document.getElementById('location-label').style.display = 'none';
  document.getElementById('areaTag').style.display = 'none';
  document.getElementById('statusDot').className = 'status-dot';
  document.getElementById('statusText').textContent = 'Konum bekleniyor';
  document.getElementById('coordsDisplay').textContent = '';
}
</script>
</body>
</html>
